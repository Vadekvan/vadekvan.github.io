name: Deploy ASTRA to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Weekly refresh; all ephemerides include dates before and after this run.
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify orbital calculations
        run: node --test tests/ephemeris.test.cjs
      - name: Refresh NASA/JPL ephemerides
        run: node scripts/update-ephemeris.cjs
      - name: Verify complete ephemerides
        run: node --test tests/ephemeris-data.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html style.css app.js solar-system.js ephemeris.js favicon.svg _site/
          cp -R assets _site/
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
